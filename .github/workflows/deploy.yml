# イベントを集め直して、パスワード付きで GitHub Pages に公開する。
#
# リポジトリは公開なので、集めたデータとパスワードはここに置かない。
# パスワードは Secrets の SITE_PASSWORD に入れ、イベントは暗号化してから Pages に上げる。
# URL は https://<ユーザー名>.github.io/<リポジトリ名>/ で、開くとパスワードを聞かれる。
name: deploy

on:
  schedule:
    - cron: '0 18 * * *' # 毎日 03:00 JST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
    steps:
      # パスワードが無いと暗号化できない。収集（相手サーバーへのアクセス）より前に止める
      - run: test -n "$SITE_PASSWORD" || { echo "Secrets に SITE_PASSWORD を入れてください"; exit 1; }
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 取得済みページとジオコーディング結果を持ち越して、相手のサーバーを叩く回数を減らす
      - uses: actions/cache@v4
        with:
          path: |
            data/.cache
            data/.geocode-cache.json
          key: collect-${{ github.run_id }}
          restore-keys: collect-

      - run: npm run collect
        env:
          CONNPASS_API_KEY: ${{ secrets.CONNPASS_API_KEY }}

      - run: npm run build

      # 平文の events.json を消して、暗号化した events.bin だけを残す
      - run: npm run seal
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      - run: test ! -e dist/data/events.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
