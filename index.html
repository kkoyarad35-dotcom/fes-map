<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ef6c3a" />
    <!-- GitHub Pages はヘッダを付けられないので、検索避けと Referer 遮断を meta でも掛けておく -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <!-- 地図タイルの取得はJSの実行後に始まる。TLS握手だけ先に済ませておく -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <meta name="description" content="現在地の近くで今日から1ヶ月先までに開催されるフェス・イベントを地図で探せます。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>ちかフェス — 近くのフェスとイベントを地図で探す</title>
  </head>
  <body>
    <div id="app">
      <div id="map" aria-label="イベント地図"></div>

      <header class="topbar">
        <div class="topbar__row">
          <div class="brand"><span class="brand__mark">🎪</span>ちかフェス</div>
          <div class="search">
            <span class="search__icon" aria-hidden="true">🔍</span>
            <input
              id="search"
              type="search"
              placeholder="イベント名・会場で絞り込む"
              autocomplete="off"
              aria-label="イベント名・会場で絞り込む"
            />
          </div>
        </div>
        <div class="chips" id="chips" role="group" aria-label="カテゴリで絞り込む"></div>
      </header>

      <nav class="datestrip" id="datestrip" aria-label="開催日を選ぶ"></nav>

      <div class="hint" id="hint" hidden></div>

      <button id="locate" class="fab" type="button" aria-label="現在地に戻る">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm8.94 3A9.01 9.01 0 0 0 13 3.06V1h-2v2.06A9.01 9.01 0 0 0 3.06 11H1v2h2.06A9.01 9.01 0 0 0 11 20.94V23h2v-2.06A9.01 9.01 0 0 0 20.94 13H23v-2h-2.06ZM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14Z"
          />
        </svg>
      </button>

      <section class="sheet" id="sheet" aria-label="イベント一覧">
        <button class="sheet__grip" id="sheet-grip" type="button" aria-label="一覧の高さを切り替える">
          <span></span>
        </button>
        <div class="sheet__head" id="sheet-head"></div>
        <div class="sheet__body" id="sheet-body"></div>
      </section>

      <!-- 地図が出た時点で外す。イベント一覧の読み込みはシート側で知らせる -->
      <div class="boot" id="boot">
        <div class="boot__mark">🎪</div>
        <p class="boot__name">ちかフェス</p>
        <p class="boot__note">近くのフェスとイベントを地図で探す</p>
        <div class="boot__bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
